aid: inflectionio
name: Inflection.io
description: >-
  Inflection.io is a B2B marketing automation platform positioned as a modern, AI-native replacement
  for legacy tools like Marketo. It unifies target accounts, product users, customers, and leads with
  product-usage, sales, and behavioral signals so marketing teams can build audiences, draft campaigns,
  map customer journeys, score accounts, and report to the CMO — executing in minutes rather than weeks.
  The Inflection Developer API is a JSON-over-HTTPS REST API (OpenAPI 3.1, base https://api.inflection.io/v1)
  for reading and writing the people in a workspace: their profiles, product and marketing activity,
  static lists, and email templates, authenticated with scoped Personal Access Tokens. Surfaced as a
  version-one-ventures portfolio company and enriched from the provider's public developer API surface.
