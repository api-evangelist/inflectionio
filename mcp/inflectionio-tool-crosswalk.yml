source: mcp/inflectionio-mcp.yml + openapi/_original/inflectionio-openapi-original.yml
note: >-
  Binds Inflection's published MCP tool list to the Developer API operations that back it. The live
  MCP tools/list is OAuth-gated (401 invalid_token, probed 2026-08-13), so tools are mapped by the
  provider's own published tool documentation and semantics rather than by an introspected inputSchema;
  confidence is set accordingly. The two surfaces are strongly divergent: the MCP server is the
  platform-authoring surface (journeys, audiences, segments, tokens, analytics) while the REST API is
  the contact-data surface. Only the personalized-email versions and contact lookup genuinely overlap.
surfaces:
  openapi:
    file: openapi/_original/inflectionio-openapi-original.yml
    base: https://api.inflection.io
    operations: 20
    auth: bearer PAT (inf_pat_) or OAuth 2.1 access token
    gated: false
  mcp:
    url: https://mcp.inflection.io/
    tools_documented: 17
    auth: OAuth 2.1 + PKCE
    gated: true
    gate_detail: tools/list returns HTTP 401 invalid_token without a connected-app bearer token
  graphql:
    present: false
crosswalk:
- tool: set_email_version
  category: personalized-email
  rest: [setEmailVersion]
  binding: rest
  confidence: high
  note: >-
    Same operation on both surfaces — POST /v1/email-versions. The REST operation's requestBody
    (contact identity + subject + preheader + html) is the tool's real input contract.
- tool: get_contact_info
  category: contacts
  rest: [getContactByEmail, getActivityLog, getSalesforceRecord]
  binding: rest
  confidence: medium
  note: >-
    One tool fans out to three REST operations. query_type=lookup maps to getContactByEmail
    (composite profile), activity_log to getActivityLog, sf_opportunities/sf_campaigns to
    getSalesforceRecord. The MCP tool returns a composite the REST API does not assemble.
- tool: list_platform_assets
  category: platform-crud
  rest: [getList]
  binding: rest
  confidence: low
  note: >-
    Only the static_list asset type has a REST read (GET /v1/lists/{id}); there is no REST list-of-lists
    operation and no REST surface at all for journey, audience, segment, email_token, webhook,
    inbound_webhook, form, account, conversion or salesforce_opportunity.
- tool: get_platform_asset
  category: platform-crud
  rest: [getList, getEmail]
  binding: rest
  confidence: medium
  note: asset_type static_list maps to getList; asset_type email maps to getEmail (GET /v1/emails/{id}).
- tool: create_platform_asset
  category: platform-crud
  rest: [createList, createEmail]
  binding: rest
  confidence: medium
  note: >-
    asset_type static_list maps to createList (POST /v1/lists); asset_type email maps to createEmail
    (POST /v1/emails). journey, email_token, tag and folder creation have no REST equivalent.
- tool: update_platform_asset
  category: platform-crud
  rest: [updateList]
  binding: rest
  confidence: medium
  note: >-
    Only the static_list rename maps to updateList (PATCH /v1/lists/{id}). email, email_content,
    journey, email_token, business_context, tag_asset, move_asset and folder patches are MCP-only.
