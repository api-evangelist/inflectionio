observed_api_changes:
  note: >-
    Not published by Inflection — recorded by API Evangelist by diffing the harvested OpenAPI between
    the 2026-07-22 and 2026-08-13 harvests of https://docs.inflection.io/api-reference/openapi.yaml.
  entries:
  - date: '2026-08-13'
    breaking: true
    changes:
    - '`/v1/email-templates` renamed to `/v1/emails`; operationId createEmailTemplate renamed to createEmail; tag "Email Templates" renamed to "Emails".'
    - '`fromEmail` on email creation changed from a string to an object with `email` and `name`; `replyTo` became required; `preheader` added.'
    - 'Added getEmail (GET /v1/emails/{id}) — emails are now create AND read over the API.'
    - 'Added setEmailVersion (POST /v1/email-versions) for Personalized Email Assets, a new "Email Versions" tag.'
    - 'Duplicate-list-name error corrected from 400 to 409 LIST_ALREADY_EXISTS in the spec.'
