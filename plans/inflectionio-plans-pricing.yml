summary: >-
  Inflection sells a single plan, metered on Monthly Marketed Contacts (MMCs) rather than on database
  size, seats, data volume or API calls. The pricing page publishes an interactive MMC price ladder,
  so the money is genuinely public up to the custom threshold; above 500,000 MMCs the slider switches
  to "Custom Pricing" and routes to sales. Every deal requires an annual commitment and the entry point
  is stated as $36K/year. The Developer API and the MCP server are included — neither is separately
  priced or metered.
metering:
  unit: MMC (Monthly Marketed Contact)
  definition: >-
    A unique contact (unique by email address) who routes through one or more Inflection journeys in a
    calendar month. Counted once per month per contact even if they trigger a journey repeatedly.
  not_metered: [contact database volume, marketable contacts, seats, data volume, API calls, Salesforce API calls]
  free_allowance: >-
    Non-personalized batch journeys (newsletters, announcements, legal notifications) do not count
    against the MMC cap, up to a ceiling of 10x the contracted MMC number.
  qualifying_criteria_docs: https://docs.inflection.io/getting-started/mmcs
